<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,follow">
<title>Redirecting… — Raemy AI</title>
<script>
  // Legacy dynamic post route — redirect to the static URL.
  // The static pages at /posts/{slug}.html are the SEO-canonical version.
  (function () {
    const slug = new URLSearchParams(window.location.search).get('slug');
    const target = slug ? '/posts/' + encodeURIComponent(slug) + '.html' : '/blog.html';
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0;url=/blog.html">
</head>
<body>
<p>Redirecting to the article… <a href="/blog.html">Go to the blog</a>.</p>
</body>
</html>
